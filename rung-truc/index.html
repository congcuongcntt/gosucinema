<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rừng Trúc Âm · Sơn Hà Dị Lục</title>
  <meta name="description" content="Rừng Trúc Âm: một lối mòn giữa rừng trúc lúc chiều tà, gió lùa ngọn trúc, sương xuống thấp. Cảnh 3D thời gian thực của dự án Sơn Hà Dị Lục.">
  <meta name="theme-color" content="#0b0f0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #e9e2cf; --dim: rgba(233, 226, 207, .55); --red: #b8321f; --bg: #0b0f0d; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .veil { position: fixed; inset: 0; background: var(--bg); pointer-events: none; transition: opacity 2.4s ease 0.2s; }
    body.ready .veil { opacity: 0; }
    .title { position: fixed; left: clamp(16px, 4vw, 48px); bottom: clamp(20px, 6vh, 56px); pointer-events: none;
             opacity: 0; transform: translateY(8px); transition: opacity 2s ease 1.6s, transform 2s ease 1.6s; }
    body.ready .title { opacity: 1; transform: none; }
    .title small { display: block; font-size: 11px; letter-spacing: .32em; color: var(--dim); margin-bottom: 10px; }
    .title h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(38px, 6vw, 76px); line-height: .95;
                color: var(--red); text-shadow: 0 2px 30px rgba(0, 0, 0, .55); letter-spacing: .01em; }
    .title p { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(16px, 1.6vw, 20px); color: var(--dim); margin-top: 10px; }
    .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
           padding: 16px clamp(16px, 4vw, 48px); font-size: 11px; letter-spacing: .28em; }
    .bar a, .bar button { color: var(--dim); text-decoration: none; background: none; border: 0; font: inherit; letter-spacing: inherit; cursor: pointer; padding: 8px 0; }
    .bar a:hover, .bar button:hover, .bar button[aria-pressed="true"] { color: var(--ink); }
    .hint { position: fixed; right: clamp(16px, 4vw, 48px); bottom: clamp(20px, 6vh, 56px); font-size: 11px; letter-spacing: .24em; color: var(--dim);
            opacity: 0; transition: opacity 2s ease 3s; }
    body.ready .hint { opacity: 1; }
    @media (max-width: 760px) { .hint { display: none; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Cảnh 3D rừng trúc lúc chiều tà"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <nav class="bar">
    <a href="../">← HỒ SƠ DỰ ÁN</a>
    <button type="button" id="sound" aria-pressed="false"><span>GIÓ: TẮT</span></button>
  </nav>
  <div class="title">
    <small>SƠN HÀ DỊ LỤC · VÙNG ĐẤT</small>
    <h1>Rừng Trúc Âm</h1>
    <p>Gió lùa qua ngọn trúc. Lối mòn không có dấu chân người.</p>
  </div>
  <div class="hint" aria-hidden="true">RÊ CHUỘT ĐỂ NGÓ · LĂN ĐỂ ĐI</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
